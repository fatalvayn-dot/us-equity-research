name: Yeni farkli 100 ABD sirketi canli finansal ve degerleme taramasi

on:
  push:
    branches: [main]
    paths: ['docs/operations/fresh100-live-request.json']

permissions:
  contents: read

concurrency:
  group: fresh100-isolated-live-financial-valuation
  cancel-in-progress: false

jobs:
  live_cohort:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Yeni SEC evreniyle eski listeyi ayir
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from equity_research.mvp import validate_candidates
          request=json.loads(Path('docs/operations/fresh100-live-request.json').read_text())
          path=Path('docs/evidence/common100/candidates.json')
          body=path.read_bytes()
          new=validate_candidates(json.loads(body))
          old=validate_candidates(json.loads(Path('docs/evidence/archived100/candidates-2026-11-19.json').read_text()))
          if (request.get('purpose')!='single_new_100_us_cohort_live_financial_valuation'
              or request.get('requested_on')!='2026-11-23'\n              or request.get('request_id')!='fresh100-score-handoff-20261123-1'
              or request.get('target')!=100 or len(new)!=100 or len(old)!=100
              or request.get('candidate_sha256')!=hashlib.sha256(body).hexdigest()
              or request.get('investment_orders') is not False
              or request.get('paid_sources') is not False
              or {r['issuer_id'] for r in new}&{r['issuer_id'] for r in old}
              or {r['symbol'] for r in new}&{r['symbol'] for r in old}):
              raise SystemExit('Yeni 100 sirket aktif kimlik listesi veya talep SHA degismis')
          print('Tam 100 yeni ABD sirketi; 0 eski ticker, 0 eski SEC CIK')
          PY
      - name: Canli yeni 100 sirket SEC finansallarini eski kayitsiz tara
        id: financial
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          python -m equity_research mvp-run \
            --candidates docs/evidence/common100/candidates.json \
            --state-dir data/fresh100/financial \
            --user-agent "$SEC_USER_AGENT" \
            --max-new-documents 100 --max-new-fields 1400
          python scripts/export_mvp_evidence.py \
            --state-dir data/fresh100/financial \
            --output data/fresh100/financial-evidence \
            --sources data/fresh100/financial-sources
      - name: Bagimsiz yeni 100 sirket hisse adedi ve fiyat kanitini topla
        id: valuation
        if: steps.financial.outcome == 'success'
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          python -m equity_research collect-valuation-sources \
            --candidates docs/evidence/common100/candidates.json \
            --state-dir data/fresh100/valuation \
            --seed-bundle data/fresh100/financial-sources \
            --user-agent "$SEC_USER_AGENT" --max-new-requests 501
      - name: Tarihli SEC karsilastirma planini sec ve engelleri kaydet
        id: plan
        if: steps.valuation.outcome == 'success'
        env:
          PYTHONPATH: src
        run: |
          python scripts/prepare_first_score_plans.py \
            --financial data/fresh100/financial/batch.json \
            --metadata data/fresh100/financial/metadata.json \
            --valuation data/fresh100/valuation/report.json \
            --companyfacts-dir data/fresh100/financial/companyfacts \
            --current-plan data/fresh100/score-plans/current.json \
            --prior-plan data/fresh100/score-plans/prior.json \
            --report data/fresh100/score-plans/selection.json
      - name: Secilmis dogrulanabilir donemleri kaynak sirasi ile dene
        id: compare
        if: steps.plan.outputs.has_candidates == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          python -m equity_research research-batch \
            --plan data/fresh100/score-plans/current.json \
            --cache-dir data/fresh100/financial/companyfacts \
            --checkpoint data/fresh100/current.sqlite \
            --output data/fresh100/current.json \
            --user-agent "$SEC_USER_AGENT" --max-new-fields 100
          python -m equity_research research-batch \
            --plan data/fresh100/score-plans/prior.json \
            --cache-dir data/fresh100/financial/companyfacts \
            --checkpoint data/fresh100/prior.sqlite \
            --output data/fresh100/prior.json \
            --user-agent "$SEC_USER_AGENT" --max-new-fields 100
      - name: Yeni kohorta yalniz kanitli kaynaklar ile skor puani hesapla
        id: score
        if: steps.plan.outcome == 'success' && (steps.compare.outcome == 'success' || steps.plan.outputs.has_candidates == 'false')
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ "${{ steps.plan.outputs.has_candidates }}" = "false" ]; then
            python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path('data/fresh100')
          for name in ('current','prior'):
              (out/f'{name}.json').write_text(json.dumps(dict(schema_version=1,generated_at=datetime.now(timezone.utc).isoformat(),companies=[])))
          PY
          fi
          ASOF=$(python -c 'from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())')
          python scripts/build_current_scores.py \
            --financial data/fresh100/financial/batch.json \
            --current data/fresh100/current.json \
            --prior data/fresh100/prior.json \
            --sources data/fresh100/valuation/source-bundle \
            --financial-sources data/fresh100/financial-sources \
            --output data/fresh100/scoring \
            --as-of "$ASOF"
      - name: Yeni 100 kimlik ve kaynak durumunu raporla
        if: always() && steps.financial.outcome == 'success'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=json.loads(Path('data/fresh100/financial/report.json').read_text())
          lines=['## Yeni ABD 100 canli finansal tarama','',
                 '- Eski adaylar kullanilmadi; yeni 100 SEC kimligi zorunlu.']
          p=f.get('pipeline',{})
          lines += [f"- Yeni islenen sirket: {p.get('requested_candidates','Bilinmiyor')}",
                    f"- SEC finansal fact bulunan: {p.get('companies_with_financial_facts','Bilinmiyor')}",
                    '- Yatirim onayi: yok.']
          val=Path('data/fresh100/valuation/report.json')
          if val.exists():
              v=json.loads(val.read_text())
              lines.append('- Degerleme kaynagi durumlari: '+json.dumps(v.get('summary',{}),ensure_ascii=False))
          if (p2:=Path('data/fresh100/score-plans/selection.json')).exists():
              sel=json.loads(p2.read_text())
              lines.append(f"- Kanitli gelir karsilastirma adaylari: {sel.get('selected')}")
          score=Path('data/fresh100/scoring/manifest.json')
          if score.exists():
              x=json.loads(score.read_text())
              lines.append(f"- Tam puanli arastirma sayisi: {x.get('summary',{}).get('scored_companies')}")
          else:
              lines.append('- Tam puanli skor raporu henuz uretilemedi, engeller devam ediyor.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Ayni kosunun finansal ve degerleme kanitlarini skor devrine hazirla
        if: steps.financial.outcome == 'success' && steps.valuation.outcome == 'success'
        env:
          PYTHONPATH: src
        run: |
          python scripts/prepare_fresh100_score_handoff.py \
            --candidates docs/evidence/common100/candidates.json \
            --financial data/fresh100/financial \
            --financial-sources data/fresh100/financial-sources \
            --valuation data/fresh100/valuation \
            --output data/fresh100/score-handoff \
            --run-id "$GITHUB_RUN_ID"

      - name: Ayni kohort finansal skor durumunu yayinla
        if: steps.financial.outcome == 'success' && steps.valuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-state
          path: data/fresh100/score-handoff/financial
          if-no-files-found: error
          retention-days: 90

      - name: Ayni kohort finansal kaynak kanitini yayinla
        if: steps.financial.outcome == 'success' && steps.valuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-evidence
          path: data/fresh100/score-handoff/financial-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Ayni kohort degerleme skor durumunu yayinla
        if: steps.financial.outcome == 'success' && steps.valuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: valuation-source-state
          path: data/fresh100/score-handoff/valuation
          if-no-files-found: error
          retention-days: 90

      - name: Finansal SEC fiyat ve puanlama kanitlarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh100-first-live-financial-valuation-evidence
          path: |
            data/fresh100/financial-evidence
            data/fresh100/financial-sources
            data/fresh100/valuation/report.json
            data/fresh100/valuation/source-bundle
            data/fresh100/score-plans
            data/fresh100/scoring
          retention-days: 90
          if-no-files-found: warn
