name: US five issuer evidence expansion
on:
  pull_request:
    paths:
      - scripts/unified_us_five.py
      - scripts/unified_us_five_scoring.py
      - tests/test_unified_us_five_scoring.py
      - tests/test_unified_us_five_source_gaps.py
      - scripts/unified_us_five_source_gaps.py
      - scripts/us_five_original_scope_audit.py
      - tests/test_us_five_original_scope_audit.py
      - scripts/us_five_final_verdict.py
      - scripts/us_five_missing_data_agent.py
      - scripts/plan_missing_financial_data.py
      - scripts/run_sec_gap_recovery.py
      - tests/test_run_sec_gap_recovery.py
      - scripts/audit_us_five_live_run.py
      - tests/test_audit_us_five_live_run.py
      - tests/test_plan_missing_financial_data.py
      - tests/test_us_five_missing_data_agent.py
      - tests/test_us_five_final_verdict.py
      - tests/test_unified_us_five.py
      - .github/workflows/unified-us-five-proof.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/unified-us-five-proof.yml
      - scripts/unified_us_five.py
      - scripts/unified_us_five_scoring.py
      - scripts/unified_us_five_source_gaps.py
      - scripts/us_five_original_scope_audit.py
      - scripts/us_five_final_verdict.py
      - scripts/us_five_missing_data_agent.py
      - scripts/plan_missing_financial_data.py
      - scripts/run_sec_gap_recovery.py
      - scripts/audit_us_five_live_run.py
permissions:
  contents: read
concurrency:
  group: us-five-proof-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  us-five:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse existing environment dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/market-radar.txt
      - name: Verify exact issuer registry, no-trade guards and provider failure isolation
        env:
          PYTHONPATH: .:src
        run: python -m unittest -v tests.test_unified_us_five tests.test_unified_us_five_scoring tests.test_unified_us_five_source_gaps tests.test_us_five_original_scope_audit tests.test_us_five_final_verdict tests.test_us_five_missing_data_agent tests.test_plan_missing_financial_data tests.test_run_sec_gap_recovery tests.test_audit_us_five_live_run tests.test_unified_single_issuer
      - name: Five-issuer live read-only evidence collector (main or manual only)
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC identity contact missing; five-company live run NOT attempted"
            exit 1
          fi
          python scripts/unified_us_five.py \
            --state-dir data/unified-us-five-sec \
            --user-agent "$SEC_USER_AGENT" \
            --max-new-fields 70 \
            --out us-five-research.json \
            --markdown us-five-research.md
      - name: Reuse existing five-company original valuation and comparison score engines
        if: success() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ] || [ ! -f data/unified-us-five-sec/report.json ]; then
            echo "SEC evidence incomplete; scoring stage not attempted"
            exit 0
          fi
          python scripts/unified_us_five_scoring.py \
            --input-report us-five-research.json \
            --sec-state data/unified-us-five-sec \
            --working-dir data/unified-us-five-scoring \
            --user-agent "$SEC_USER_AGENT" \
            --max-new-requests 26 \
            --out us-five-with-scores.json \
            --markdown us-five-with-scores.md
      - name: Diagnose exact missing GAAP fields and share-class blockers from existing source evidence
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          if [ ! -f data/unified-us-five-sec/report.json ] || \
             [ ! -f data/unified-us-five-scoring/valuation-report.json ] || \
             [ ! -f data/unified-us-five-scoring/score-plan.json ]; then
            echo "Missing source artifact; no invented diagnostics"
            exit 0
          fi
          python scripts/unified_us_five_source_gaps.py \
            --sec-report data/unified-us-five-sec/report.json \
            --valuation-report data/unified-us-five-scoring/valuation-report.json \
            --score-plan data/unified-us-five-scoring/score-plan.json \
            --out us-five-source-gaps.json \
            --markdown us-five-source-gaps.md
      - name: Reverify archived original NVDA AMZN GOOGL annual 10-K and GAAP scopes
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        run: |
          python scripts/us_five_original_scope_audit.py \
            --root . \
            --out us-five-original-scope-audit.json \
            --markdown us-five-original-scope-audit.md
      - name: Missing-data research worker creates bounded evidence-only task queue
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          if [ ! -f us-five-source-gaps.json ] || [ ! -f us-five-original-scope-audit.json ]; then
            echo "Research queue not generated: incomplete original source evidence"
            exit 0
          fi
          python scripts/us_five_missing_data_agent.py \
            --gaps us-five-source-gaps.json \
            --original us-five-original-scope-audit.json \
            --out us-five-missing-data-tasks.json \
            --markdown us-five-missing-data-tasks.md
      - name: Create generic bounded gap-recovery plan from verified five issuer source audit
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          if [ ! -f us-five-source-gaps.json ]; then
            echo "Missing verified gap report, generic recovery plan not generated"
            exit 0
          fi
          python scripts/plan_missing_financial_data.py \
            --gaps us-five-source-gaps.json \
            --limit 500 \
            --out us-five-generic-recovery-plan.json \
            --markdown us-five-generic-recovery-plan.md
      - name: Bounded SEC missing-field worker, verified candidate evidence only
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ ! -f us-five-generic-recovery-plan.json ] || [ -z "$SEC_USER_AGENT" ]; then
            echo "Missing source plan or SEC contact; recovery not run"
            exit 0
          fi
          python scripts/run_sec_gap_recovery.py \
            --plan us-five-generic-recovery-plan.json \
            --db data/us-five-recovery-checkpoint.sqlite \
            --user-agent "$SEC_USER_AGENT" \
            --max-issuers 5 \
            --out us-five-sec-recovery-observations.json
      - name: Synthesize one fail-closed five-company expert acceptance verdict
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          if [ ! -f us-five-with-scores.json ] || \
             [ ! -f us-five-source-gaps.json ] || \
             [ ! -f us-five-original-scope-audit.json ]; then
            echo "Incomplete evidence files; final five-company acceptance withheld"
            exit 0
          fi
          python scripts/us_five_final_verdict.py \
            --scored us-five-with-scores.json \
            --gaps us-five-source-gaps.json \
            --original us-five-original-scope-audit.json \
            --out us-five-final-verdict.json \
            --markdown us-five-final-verdict.md
      - name: Assert real five-company evidence artifacts and record critical stage failures
        if: always() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: .:src
        run: |
          python scripts/audit_us_five_live_run.py \
            --sec data/unified-us-five-sec/report.json \
            --scored us-five-with-scores.json \
            --gaps us-five-source-gaps.json \
            --verdict us-five-final-verdict.json \
            --recovery us-five-sec-recovery-observations.json \
            --out us-five-stage-audit.json
      - name: Archive bounded, non-sensitive research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-five-evidence
          path: |
            us-five-research.json
            us-five-research.md
            us-five-with-scores.json
            us-five-with-scores.md
            us-five-source-gaps.json
            us-five-source-gaps.md
            us-five-original-scope-audit.json
            us-five-original-scope-audit.md
            us-five-final-verdict.json
            us-five-final-verdict.md
            us-five-stage-audit.json
            us-five-missing-data-tasks.json
            us-five-missing-data-tasks.md
            us-five-generic-recovery-plan.json
            us-five-generic-recovery-plan.md
            us-five-sec-recovery-observations.json
            data/us-five-recovery-checkpoint.sqlite
            data/unified-us-five-scoring/score-plan.json
            data/unified-us-five-scoring/valuation-report.json
            data/unified-us-five-scoring/scoring/report.md
            data/unified-us-five-sec/report.json
            data/unified-us-five-sec/metadata.json
            data/unified-us-five-sec/plan.json
          if-no-files-found: ignore
          retention-days: 7
