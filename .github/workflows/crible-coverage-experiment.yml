name: Crible 10-stock coverage experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/experiment_crible_coverage.py'
      - '.github/workflows/crible-coverage-experiment.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Crible in isolated environment
        run: |
          python -m venv .crible-venv
          .crible-venv/bin/python -m pip install --disable-pip-version-check 'git+https://github.com/maxgfr/crible.git'
      - name: Check 10-stock published data availability
        env:
          CRIBLE_COMMAND: .crible-venv/bin/crible
        run: python scripts/experiment_crible_coverage.py
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crible-ten-stock-coverage
          path: |
            crible_coverage/coverage.json
            crible_coverage/bootstrap_stdout.txt
          if-no-files-found: warn
