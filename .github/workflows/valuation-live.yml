name: Canlı değerleme kaynakları

on:
  # SEC toplaması yeni artifact üretmediğinde bile, eski kanıtı yeni tarihli
  # saymadan piyasa kaynaklarını kontrollü şekilde yenile.
  schedule:
    - cron: '17 9 * * *'
  workflow_run:
    workflows: ['Canlı 100 şirket kabulü']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Veri üretmiş 100 şirket kabul çalışmasının sayısal run ID değeri
        required: true
        type: string
      valuation_resume_run_id:
        description: Son değerleme çalışmasının run ID değeri (boşsa otomatik bulunur)
        required: false
        type: string
      max_new_requests:
        description: Bu çalışmada yeni dış kaynak GET bütçesi
        required: true
        default: '51'
        type: choice
        options: ['0', '51', '100', '250', '501']

permissions:
  contents: read
  actions: read

concurrency:
  group: valuation-source-collection
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kanıt üreten kaynak çalışmayı ve devam durumunu seç
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_INPUT: ${{ inputs.source_run_id }}
          RESUME_RUN_INPUT: ${{ inputs.valuation_resume_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN=$(python -m scripts.select_valuation_financial_source)
          RESUME_RUN=$(python -m scripts.select_valuation_resume)
          echo "collect=true" >> "$GITHUB_OUTPUT"
          echo "source_run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "resume_run=$RESUME_RUN" >> "$GITHUB_OUTPUT"

      - name: SEC iletişim kimliğini doğrula
        if: steps.select.outputs.collect == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret eksik"
            exit 2
          fi

      - name: Önceki değerleme çalışma durumunu yükle
        if: steps.select.outputs.collect == 'true'
        uses: actions/download-artifact@v4
        with:
          name: valuation-source-state
          path: data/valuation-current
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.resume_run }}

      - name: İndirilen değerleme durumunu salt okunur doğrula
        id: verify_resume
        if: steps.select.outputs.collect == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m scripts.verify_valuation_state data/valuation-current \
            --write-observations "$RUNNER_TEMP/valuation-observations.json"

      - name: Değerleme paketinin finansal kaynak run ID bilgisini kaydet
        if: steps.select.outputs.collect == 'true'
        env:
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
        run: |
          mkdir -p data/valuation-current
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('data/valuation-current/financial-source-run.json').write_text(
              json.dumps(dict(run_id=int(os.environ['SOURCE_RUN'])))+'\n')
          PY

      - name: Doğrulanmış finansal kaynak paketini indir
        if: steps.select.outputs.collect == 'true'
        uses: actions/download-artifact@v4
        with:
          name: live-acceptance-evidence
          path: data/valuation-import
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.source_run }}

      - name: Kaynak paketinin bulunduğunu doğrula
        if: steps.select.outputs.collect == 'true'
        run: |
          test -f data/valuation-import/live-sources/manifest.json || {
            echo "::error::Kaynak paketi bulunamadı"
            exit 2
          }

      - name: Güncel fiyat ve hisse sınıfı kanıtlarını kontrollü topla
        if: steps.select.outputs.collect == 'true'
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAX_NEW_REQUESTS: ${{ inputs.max_new_requests || (github.event_name == 'workflow_run' && '51' || '250') }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          RESUME_RUN: ${{ steps.select.outputs.resume_run }}
        run: |
          set -euo pipefail
          resume_args=()
          if [ -n "$RESUME_RUN" ]; then resume_args=(--resume-run "$RESUME_RUN"); fi
          priority=$(python scripts/select_reviewed_valuation_priority.py \
            --plan docs/evidence/valuation-priority-candidates-2026-11-09.json \
            --source-run "$SOURCE_RUN" "${resume_args[@]}" \
            --resume-report data/valuation-current/report.json \
            --lineage data/valuation-current/priority-lineage.json)
          priority_args=()
          if [ -n "$priority" ]; then priority_args=(--priority-candidates "$priority"); fi
          python -m equity_research collect-valuation-sources \
            --candidates docs/evidence/common100/candidates.json \
            --state-dir data/valuation-current \
            --seed-bundle data/valuation-import/live-sources \
            --user-agent "$SEC_USER_AGENT" \
            --max-new-requests "$MAX_NEW_REQUESTS" "${priority_args[@]}"
          # Persist continuation only after a successful exact-priority
          # collection, never for a skipped, invalid or zero-priority run.
          if [ -n "$priority" ] && [ "$MAX_NEW_REQUESTS" -gt 0 ]; then
            python scripts/select_reviewed_valuation_priority.py record \
              --plan "$priority" --source-run "$SOURCE_RUN" \
              --run-id "$GITHUB_RUN_ID" \
              --report data/valuation-current/report.json \
              --lineage data/valuation-current/priority-lineage.json
          fi

      - name: Yeni değerleme durumunu ve kaynak devamlılığını doğrula
        if: steps.select.outputs.collect == 'true' && success()
        env:
          PYTHONPATH: src
        run: |
          python -m scripts.verify_valuation_state data/valuation-current \
            --require-observations "$RUNNER_TEMP/valuation-observations.json"

      - name: Kaynak toplama özetini göster
        if: steps.select.outputs.collect == 'true' && success()
        env:
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          RESUME_RUN: ${{ steps.select.outputs.resume_run }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('data/valuation-current/report.json').read_text())
          s=report['summary']
          priority=', '.join(report['priority_symbols']) or 'yok'
          lines=['## Canlı değerleme kaynakları', '',
                 'Kaynak toplama sonuçlarıdır; nihai yatırım skoru veya MVP kabulü değildir.', '',
                 f"- Finansal kaynak run: {os.environ['SOURCE_RUN']}",
                 f"- Önceki değerleme run: {os.environ['RESUME_RUN'] or 'ilk çalışma'}",
                 f"- Şirket: {s['candidates']}",
                 f"- Yeni GET: {s['new_get_invocations']}",
                 f"- Öncelikli tarama: {priority}",
                 f"- Hisse sınıfı: {s['share_states']}",
                 f"- Fiyat: {s['price_states']}",
                 f"- Piyasa geçmişi: {s['history_states']}"]
          print(json.dumps(s,ensure_ascii=False,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('\n'.join(lines)+'\n')
          PY

      - name: Değerleme kanıtını ve devam durumunu koru
        if: >-
          always() && steps.select.outputs.collect == 'true'
          && steps.verify_resume.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: valuation-source-state
          path: |
            data/valuation-current
            !data/valuation-current/blocker-audit.json
          if-no-files-found: error
          retention-days: 90
