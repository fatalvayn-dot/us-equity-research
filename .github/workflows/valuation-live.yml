name: Canlı değerleme kaynakları

on:
  workflow_run:
    workflows: ['Canlı 100 şirket kabulü']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Veri üretmiş 100 şirket kabul çalışmasının sayısal run ID değeri
        required: true
        type: string
      valuation_resume_run_id:
        description: Önceki değerleme çalışmasının run ID değeri (boşsa otomatik bulunur)
        required: false
        type: string
      max_new_requests:
        description: Bu çalışmada yeni dış kaynak GET bütçesi
        required: true
        default: '51'
        type: choice
        options: ['0', '51', '100', '250', '501']

permissions:
  contents: read
  actions: read

concurrency:
  group: valuation-source-collection
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kanıt üreten kaynak çalışmayı ve devam durumunu seç
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_INPUT: ${{ inputs.source_run_id }}
          EVENT_SOURCE_RUN: ${{ github.event.workflow_run.id }}
          RESUME_RUN_INPUT: ${{ inputs.valuation_resume_run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_RUN="${SOURCE_RUN_INPUT:-$EVENT_SOURCE_RUN}"
          if ! [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Kaynak run ID pozitif sayı olmalıdır"
            exit 2
          fi
          ARTIFACT_COUNT=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "live-acceptance-evidence" and .expired == false)] | length')
          if [ "$ARTIFACT_COUNT" -ne 1 ]; then
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "Veri üretmeyen/kanıtsız SEC koşusu: değerleme toplaması atlandı." >> "$GITHUB_STEP_SUMMARY"
              echo "collect=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Seçilen run için tek ve geçerli live-acceptance-evidence artifact bulunamadı"
            exit 2
          fi
          RESUME_RUN="$RESUME_RUN_INPUT"
          if [ -n "$RESUME_RUN" ] && ! [[ "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Devam run ID pozitif sayı olmalıdır"
            exit 2
          fi
          if [ -z "$RESUME_RUN" ]; then
            for PREV in $(gh api "repos/$REPO/actions/workflows/valuation-live.yml/runs?per_page=30" \
              --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_branch == "main") | .id'); do
              FOUND=$(gh api "repos/$REPO/actions/runs/$PREV/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "valuation-source-state" and .expired == false)] | length')
              if [ "$FOUND" -eq 1 ]; then
                RESUME_RUN="$PREV"
                break
              fi
            done
          fi
          echo "collect=true" >> "$GITHUB_OUTPUT"
          echo "source_run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "resume_run=$RESUME_RUN" >> "$GITHUB_OUTPUT"

      - name: SEC iletişim kimliğini doğrula
        if: steps.select.outputs.collect == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret eksik"
            exit 2
          fi

      - name: Önceki değerleme çalışma durumunu yükle
        if: steps.select.outputs.collect == 'true' && steps.select.outputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: valuation-source-state
          path: data/valuation-current
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.resume_run }}

      - name: Doğrulanmış finansal kaynak paketini indir
        if: steps.select.outputs.collect == 'true'
        uses: actions/download-artifact@v4
        with:
          name: live-acceptance-evidence
          path: data/valuation-import
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.source_run }}

      - name: Kaynak paketinin bulunduğunu doğrula
        if: steps.select.outputs.collect == 'true'
        run: |
          test -f data/valuation-import/live-sources/manifest.json || {
            echo "::error::Kaynak paketi bulunamadı"
            exit 2
          }

      - name: Güncel fiyat ve hisse sınıfı kanıtlarını kontrollü topla
        if: steps.select.outputs.collect == 'true'
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAX_NEW_REQUESTS: ${{ inputs.max_new_requests || '51' }}
        run: |
          python -m equity_research collect-valuation-sources \
            --candidates docs/evidence/common100/candidates.json \
            --state-dir data/valuation-current \
            --seed-bundle data/valuation-import/live-sources \
            --user-agent "$SEC_USER_AGENT" \
            --max-new-requests "$MAX_NEW_REQUESTS"

      - name: Kaynak toplama özetini göster
        if: steps.select.outputs.collect == 'true' && success()
        env:
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          RESUME_RUN: ${{ steps.select.outputs.resume_run }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('data/valuation-current/report.json').read_text())
          s=report['summary']
          lines=['## Canlı değerleme kaynakları', '',
                 'Kaynak toplama sonuçlarıdır; nihai yatırım skoru veya MVP kabulü değildir.', '',
                 f"- Finansal kaynak run: {os.environ['SOURCE_RUN']}",
                 f"- Önceki değerleme run: {os.environ['RESUME_RUN'] or 'ilk çalışma'}",
                 f"- Şirket: {s['candidates']}",
                 f"- Yeni GET: {s['new_get_invocations']}",
                 f"- Hisse sınıfı: {s['share_states']}",
                 f"- Fiyat: {s['price_states']}",
                 f"- Piyasa geçmişi: {s['history_states']}"]
          print(json.dumps(s,ensure_ascii=False,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('\n'.join(lines)+'\n')
          PY

      - name: Değerleme kanıtını ve devam durumunu koru
        if: always() && steps.select.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: valuation-source-state
          path: data/valuation-current
          if-no-files-found: error
          retention-days: 90
