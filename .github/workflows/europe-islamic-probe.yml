name: Europe Islamic data access probe
on:
  push:
    branches: [feat/europe-msci-islamic-gate-20261120]
    paths: ['.github/workflows/europe-islamic-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check provider access and holdings availability
        run: |
          python - <<'PY'
          import re,urllib.request
          urls={
           "msci_index":"https://www.msci.com/indexes/index/762539/msci-europe-imi-islamic-index",
           "hsbc_etf":"https://www.assetmanagement.hsbc.co.uk/en/institutional-investor/funds/ie000agfzm58",
           "marketscreener_holdings":"https://www.marketscreener.com/quote/etf/HSBC-MSCI-EUROPE-ISLAMIC--147881558/components/",
           "msci_constituents":"https://www.msci.com/constituents",
          }
          for key,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(900000);txt=data.decode("utf-8",errors="replace")
                      print(key,"status",r.status,"bytes",len(data),"type",r.headers.get("content-type"))
                      for word in ("428","ASML","Holdings","Top 10","constituents","download","CSV","IE000AGFZM58"):
                          print("term",word,bool(re.search(word,txt,re.I)))
                      print("title",re.findall(r"<title[^>]*>(.*?)</title>",txt,re.I|re.S)[:1])
              except Exception as ex:print(key,"ERROR",type(ex).__name__,str(ex)[:180])
          print("HSBC_HOLDINGS_CONTEXT")
          try:
              url=urls["hsbc_etf"]
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as resp: doc=resp.read().decode("utf-8",errors="replace")
              for match in list(re.finditer(r"holdings|portfolio|download|factsheet",doc,re.I))[:35]:
                  print(re.sub(r"\\s+"," ",doc[max(0,match.start()-120):match.end()+160])[:350])
          except Exception as ex:print("context_failed",type(ex).__name__,str(ex)[:130])
          PY
