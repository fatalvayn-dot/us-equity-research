name: Market radar manual pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream market-data adapter
        run: python -m pip install --disable-pip-version-check -r requirements/market-radar.txt
      - name: Offline regression tests
        env:
          PYTHONPATH: .:src
        run: python -m unittest tests.test_market_radar_pilot tests.test_market_radar_universe -v
      - name: Read-only live market-data attempt
        env:
          PYTHONPATH: .:src
        run: python scripts/market_radar_pilot.py --universe data/analyst/radar_small_us_trial.json --out radar-pilot-report.json
      - name: Save evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-radar-pilot
          path: radar-pilot-report.json
          retention-days: 7
