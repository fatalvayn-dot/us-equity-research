name: Live public-source connectivity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-preflight
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SEC identity configuration
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT repository secret is not configured. Use a truthful identifying User-Agent with contact information."
            exit 2
          fi
      - name: Probe public sources using existing bounded transport
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/check_live_sources.py --user-agent "$SEC_USER_AGENT" --output data/live-preflight.json
      - name: Upload safe diagnostic (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-preflight
          path: data/live-preflight.json
          if-no-files-found: ignore
          retention-days: 7
