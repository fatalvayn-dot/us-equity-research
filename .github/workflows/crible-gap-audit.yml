name: Crible existing-source gap comparison
on:
  pull_request:
    paths:
      - 'src/equity_research/crible_audit.py'
      - 'scripts/audit_crible_snapshot.py'
      - 'tests/test_crible_audit.py'
      - '.github/workflows/crible-gap-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run new independent unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_crible_audit.py -v
      - name: Retrieve immutable 100-symbol Crible evidence
        uses: actions/download-artifact@v4
        with:
          name: crible-hundred-stock-coverage
          run-id: 44061565812
          github-token: ${{ github.token }}
          path: .crible-evidence
      - name: Compare only uncovered source fields
        run: PYTHONPATH=src python scripts/audit_crible_snapshot.py --crible-json .crible-evidence/coverage.json --output crible-gap-audit.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crible-existing-source-gap-audit
          path: crible-gap-audit.json
          if-no-files-found: warn
