name: Canlı 100 şirket kabulü

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/live-acceptance.yml
      - scripts/live_checkpoint.py
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Son devam çalışmasının sayısal run ID değeri; boşsa son durum otomatik seçilir
        required: false
        type: string
      max_new_documents:
        description: Bu çalışmada indirilecek en fazla yeni yıllık bildirim
        required: true
        default: '25'
        type: choice
        options: ['25', '50', '100']
      max_new_fields:
        description: Bu çalışmada işlenecek en fazla yeni finansal alan
        required: true
        default: '250'
        type: choice
        options: ['250', '500', '900']
  pull_request:
    paths:
      - .github/workflows/live-acceptance.yml
      - scripts/check_live_sources.py
      - scripts/export_mvp_evidence.py

permissions:
  contents: read
  actions: read

concurrency:
  group: live-acceptance
  cancel-in-progress: false

jobs:
  collect:
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SEC iletişim kimliğini doğrula
        if: github.event_name != 'pull_request'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT GitHub Actions secret tanımlanmalı. Gerçek kurum/proje adı ve iletişim e-postası içermeli."
            exit 2
          fi

      - name: Son güvenli devam çalışmasını seç
        id: checkpoint
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.resume_run_id }}
        run: python scripts/live_checkpoint.py select --requested "$REQUESTED_RUN"

      - name: Önceki durum dosyalarını indir
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: live-acceptance-state
          path: data/live-acceptance
          github-token: ${{ github.token }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}

      - name: Dosya özetlerini SQLite kayıtlarını ve kiraları doğrula
        id: verified
        if: github.event_name != 'pull_request'
        env:
          RESUME_RUN: ${{ steps.checkpoint.outputs.run_id }}
        run: python scripts/live_checkpoint.py verify --run-id "$RESUME_RUN"

      - name: Kamu veri kaynaklarına erişimi ölç
        id: preflight
        if: github.event_name == 'pull_request' || steps.verified.outputs.collect == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ github.event_name != 'pull_request' && secrets.SEC_USER_AGENT || '' }}
        run: |
          python scripts/check_live_sources.py \
            --user-agent "${SEC_USER_AGENT:-US Equity Research (https://github.com/fatalvayn-dot/us-equity-research)}" \
            --output data/live-preflight.json

      - name: Erişim kanıtını sakla
        if: always() && steps.preflight.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: live-source-preflight
          path: data/live-preflight.json
          if-no-files-found: error
          retention-days: 14

      - name: SEC DNS TCP TLS bağlantı tanısı
        if: steps.preflight.outcome == 'failure'
        run: python scripts/diagnose_sec_network.py --output data/sec-network-diagnostic.json

      - name: SEC bağlantı tanısını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-network-diagnostic
          path: data/sec-network-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Zorunlu SEC kaynaklarını denetle
        id: source_gate
        if: github.event_name == 'pull_request' || steps.verified.outputs.collect == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('data/live-preflight.json').read_text())
          states={row['source']:row['reachable'] for row in report['sources']}
          # Metadata collection needs SEC submissions. Other providers are
          # checked independently by the bounded MVP collector; missing data
          # must remain missing and cannot count as live financial acceptance.
          required={'sec_submissions'}
          missing=sorted(name for name in required if not states.get(name,False))
          unavailable=sorted(name for name,reachable in states.items() if not reachable)
          print(json.dumps({'required_to_start':sorted(required),
                            'unavailable_during_preflight':unavailable,
                            'missing_required':missing}))
          raise SystemExit(bool(missing))
          PY

      - name: Devam ettirilebilir finansal veri toplamasını çalıştır
        id: mvp
        if: steps.source_gate.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: src
          MAX_NEW_DOCUMENTS: ${{ inputs.max_new_documents || (github.event_name == 'pull_request' && '5' || '25') }}
          MAX_NEW_FIELDS: ${{ inputs.max_new_fields || (github.event_name == 'pull_request' && '30' || '500') }}
          SEC_USER_AGENT: ${{ github.event_name != 'pull_request' && secrets.SEC_USER_AGENT || '' }}
        run: |
          python -m equity_research mvp-run \
            --candidates docs/evidence/common100/candidates.json \
            --state-dir data/live-acceptance \
            --user-agent "${SEC_USER_AGENT:-US Equity Research (https://github.com/fatalvayn-dot/us-equity-research)}" \
            --max-new-documents "$MAX_NEW_DOCUMENTS" \
            --max-new-fields "$MAX_NEW_FIELDS"

      - name: Taşınabilir kaynak kanıtını üret
        if: steps.mvp.outcome == 'success'
        env:
          PYTHONPATH: src
        run: >-
          python scripts/export_mvp_evidence.py
          --state-dir data/live-acceptance
          --output data/live-evidence
          --sources data/live-sources

      - name: Devam durumunun bütünlüğünü mühürle
        id: sealed
        if: always() && github.event_name != 'pull_request' && steps.verified.outcome == 'success' && steps.mvp.outcome != 'skipped'
        run: python scripts/live_checkpoint.py seal --run-id "$GITHUB_RUN_ID"

      - name: Devam durumunu sakla
        if: always() && steps.sealed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-state
          path: data/live-acceptance
          if-no-files-found: warn
          retention-days: 90

      - name: Mühürlenemeyen durumu kurtarma için koru
        if: always() && github.event_name != 'pull_request' && steps.verified.outcome == 'success' && steps.mvp.outcome != 'skipped' && steps.sealed.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-recovery
          path: data/live-acceptance
          if-no-files-found: error
          retention-days: 90

      - name: Taşınabilir kabul kanıtını sakla
        if: always() && steps.mvp.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-evidence
          path: |
            data/live-evidence
            data/live-sources
          if-no-files-found: warn
          retention-days: 90

      - name: Veri toplama kesildiyse çalışmayı başarısız say
        if: steps.mvp.outcome == 'failure'
        run: exit 1
