name: Finansal SEC yenileme talebi

on:
  push:
    branches: [main]
    paths: ['docs/operations/financial-collection-request.json']

permissions:
  contents: read
  actions: write

concurrency:
  group: reviewed-financial-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tam kaynak kimligini ve kontrollu istegi dogrula
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.live_checkpoint import ROOT_RUN, MAX_REVIEWED_SEQUENCE, REVIEWED_STATE
          request = json.loads(Path('docs/operations/financial-collection-request.json').read_text())
          proof = json.loads(REVIEWED_STATE.read_text())
          if (request.get('purpose') != 'single_reviewed_financial_refresh'
                  or request.get('requested_on') != '2026-11-19'
                  or type(request.get('expected_parent_run_id')) is not int
                  or request['expected_parent_run_id'] != proof['financial_lineage']['run_id']
                  or request.get('expected_parent_sha256') != proof['artifact_sha256']['financial']
                  or proof['financial_lineage']['root_run_id'] != ROOT_RUN
                  or MAX_REVIEWED_SEQUENCE != proof['financial_lineage']['sequence'] + 1
                  or request.get('max_new_documents') != 25
                  or request.get('max_new_fields') != 1400
                  or request.get('investment_orders') is not False):
              raise SystemExit('Finansal yenileme istegi onayli sequence-10 kaynagiyla eslesmiyor')
          print('Tek SEC veri yenileme istegi incelenen kaynakla eslesti')
          PY
      - name: Guvenli orijinal toplama akisini baslat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live-acceptance.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            --field max_new_documents=25 --field max_new_fields=1400
