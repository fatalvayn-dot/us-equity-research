name: LLM manager team (opt-in)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/llm-team.yml
      - scripts/llm_team.py
  pull_request:
    paths:
      - scripts/llm_team.py
      - tests/test_llm_team.py
      - .github/workflows/llm-team.yml
permissions:
  contents: read
jobs:
  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify agent contracts offline
        env:
          PYTHONPATH: .:src
        run: python -m unittest tests.test_llm_team -v
  llm-execution:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: agent-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one source-backed AAPL technical research envelope
        env:
          PYTHONPATH: .:src
        run: |
          python -m pip install --disable-pip-version-check -r requirements/market-radar.txt
          mkdir -p radar-input
          python scripts/unified_single_issuer.py --symbol AAPL --out radar-input/aapl.json

      - name: Test exact AAPL five-agent free-only provider or report missing configuration
        env:
          PYTHONPATH: .:src
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RADAR_FREE_LLM_ENABLED: ${{ vars.RADAR_FREE_LLM_ENABLED }}
        run: |
          python scripts/unified_aapl_llm.py --input radar-input/aapl.json --out llm-team-report.json
      - name: Upload non-sensitive manager report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-manager-report
          path: llm-team-report.json
          if-no-files-found: ignore
          retention-days: 7
