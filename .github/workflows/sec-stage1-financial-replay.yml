name: Iki SEC kaynagini canli finansal batch uzerinde tekrar test et

on:
  push:
    branches: [main]
    paths: ['docs/operations/sec-stage1-financial-replay-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-stage1-reviewed-financial-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tek seferlik finansal batch karsilastirma istegini denetle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/operations/sec-stage1-financial-replay-request.json').read_text())
          if (r.get('purpose')!='readonly_original_sec_against_selected_financial_batch'
              or r.get('requested_on')!='2026-11-19'
              or r.get('financial_source_run_id')!=44526775886
              or r.get('sec_original_source_run_id')!=44543645240
              or r.get('investment_orders') is not False
              or r.get('motherduck_write') is not False):
              raise SystemExit('Finansal tekrar testi yetkisiz')
          PY
      - name: Son gercek SEC finansal batch arşivini indir
        uses: actions/download-artifact@v4
        with:
          name: live-acceptance-state
          run-id: 44526775886
          github-token: ${{ github.token }}
          path: data/financial
      - name: Iki resmi SEC ham belgeyi indir
        uses: actions/download-artifact@v4
        with:
          name: sec-stage1-original-raw-evidence
          run-id: 44543645240
          github-token: ${{ github.token }}
          path: data/sec-stage1
      - name: Iki kaynagi gercek 100-sirket finansal batch ile iki defa karsilastir
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          from equity_research.sec_attestation import guard_selected_batch
          finance=Path('data/financial/batch.json')
          raw=Path('data/sec-stage1')
          before=hashlib.sha256(finance.read_bytes()).hexdigest()
          financial=json.loads(finance.read_bytes())
          manifest=json.loads((raw/'verified-sec-stage1.json').read_text())
          cutoff=datetime.now(timezone.utc)
          a=guard_selected_batch(financial,raw,manifest,as_of=cutoff)
          b=guard_selected_batch(financial,raw,manifest,as_of=cutoff)
          if a!=b or hashlib.sha256(finance.read_bytes()).hexdigest()!=before:
              raise SystemExit('SEC/finansal batch tekrar testi farkli sonuc verdi')
          ids={c['issuer_id'] for c in financial['companies']}
          if not {'0001045810','0000004127'}.issubset(ids):
              raise SystemExit('Kaynak finansal batch icinde iki sirket yok')
          report=dict(schema_version=1,financial_batch_sha256=before,
                      financial_source_run_id=44526775886,
                      original_sec_source_run_id=44543645240,
                      original_source_artifact_id=14539511083,
                      replay_runs=2,replay_identical=True,
                      evaluated_companies=len(financial['companies']),
                      supplemental_sec_evidence=a,
                      source_selected_facts_mutated=False,
                      scored_companies_added=0,
                      investment_approved=False)
          dest=Path('data/sec-stage1-financial-replay')
          dest.mkdir(parents=True,exist_ok=True)
          (dest/'report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:report[k] for k in ('evaluated_companies','replay_runs',
               'replay_identical','source_selected_facts_mutated','investment_approved')},sort_keys=True))
          print(json.dumps(a,sort_keys=True))
          PY
      - name: Kanit ve SHA-256 dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: sec-stage1-financial-batch-replay-evidence
          path: data/sec-stage1-financial-replay/report.json
          retention-days: 30
          if-no-files-found: error
