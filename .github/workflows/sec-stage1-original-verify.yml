name: Iki SEC kaynagi ozgun SHA-256 dogrulama

on:
  push:
    branches: [main]
    paths: ['docs/operations/sec-stage1-verify-request.json']

permissions:
  contents: read

concurrency:
  group: sec-stage1-one-shot-audit
  cancel-in-progress: false

jobs:
  sec_raw_audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tek seferlik acik istegi ve sinirlari denetle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.live_stage1_sec_verification import PUBLIC_CLAIMS
          req=json.loads(Path('docs/operations/sec-stage1-verify-request.json').read_text())
          expected={c['cik'] for c in PUBLIC_CLAIMS}
          if (req.get('purpose')!='sec_liabilities_two_original_source_replay'
              or req.get('requested_on')!='2026-11-19'
              or req.get('issuer_ids')!=sorted(expected)
              or req.get('max_sec_get_requests')!=2
              or req.get('investment_orders') is not False
              or req.get('motherduck_write') is not False):
              raise SystemExit('Onaysiz veya kapsam disi SEC dogrulama istegi')
          print('Iki kamusal SEC kaynagi icin bir defalik istek dogrulandi')
          PY

      - name: Ozgun SEC CompanyConcept yanitlarini al ve 2 kez karsilastir
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          PYTHONPATH=src python -m scripts.live_stage1_sec_verification --output data/sec-stage1

      - name: Iki SEC raporunu belge kimligiyle kaydet
        uses: actions/upload-artifact@v4
        with:
          name: sec-stage1-original-raw-evidence
          path: data/sec-stage1
          retention-days: 30
          if-no-files-found: error

      - name: Turkce test ozeti
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('data/sec-stage1/verified-sec-stage1.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Iki SEC kaynagi SHA-256 dogrulamasi\n\n')
              for record in r['records']:
                  f.write(f"- CIK {record['issuer_id']} / {record['accession']}: `{record['source_raw_sha256']}` ({record['source_original_bytes']} bayt)\n")
              f.write('\nIki kez ayni ham yanit uzerinde replay; puan degismedi, alis emri yok.\n')
          PY
