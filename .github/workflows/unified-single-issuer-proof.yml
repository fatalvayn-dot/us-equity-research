name: Unified radar single issuer proof
on:
  pull_request:
    paths:
      - scripts/unified_single_issuer.py
      - tests/test_unified_single_issuer.py
      - .github/workflows/unified-single-issuer-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing free research adapter
        run: python -m pip install --disable-pip-version-check -r requirements/market-radar.txt
      - name: Offline end-to-end and failure regression
        env:
          PYTHONPATH: .:src
        run: python -m unittest -v tests.test_unified_single_issuer
      - name: Live read-only AAPL one-source attempt
        env:
          PYTHONPATH: .:src
        run: python scripts/unified_single_issuer.py --symbol AAPL --out unified-single-issuer.json
      - name: Reuse real SEC collector for AAPL if official contact is configured
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC official contact not configured; financial stage not tested"
            exit 0
          fi
          python scripts/unified_sec_one_issuer.py \\
            --user-agent "$SEC_USER_AGENT" \\
            --state-dir data/unified-aapl-sec \\
            --out unified-aapl-sec-report.json
          python scripts/unified_single_issuer.py \\
            --symbol AAPL \\
            --financial-cik 0000320193 \\
            --financial-report unified-aapl-sec-report.json \\
            --out unified-single-issuer-with-financials.json
      - name: Archive timestamped proof without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-aapl-proof
          path: |\n            unified-single-issuer.json\n            unified-single-issuer-with-financials.json\n            unified-aapl-sec-report.json
          if-no-files-found: ignore
          retention-days: 7
