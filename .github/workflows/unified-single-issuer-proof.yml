name: Unified radar single issuer proof
on:
  pull_request:
    paths:
      - scripts/unified_single_issuer.py
      - tests/test_unified_single_issuer.py
      - tests/test_unified_aapl_valuation.py
      - scripts/unified_aapl_valuation.py
      - .github/workflows/unified-single-issuer-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing free research adapter
        run: python -m pip install --disable-pip-version-check -r requirements/market-radar.txt
      - name: Offline end-to-end and failure regression
        env:
          PYTHONPATH: .:src
        run: python -m unittest -v tests.test_unified_single_issuer tests.test_unified_aapl_valuation
      - name: Live read-only AAPL one-source attempt
        env:
          PYTHONPATH: .:src
        run: python scripts/unified_single_issuer.py --symbol AAPL --out unified-single-issuer.json --markdown unified-single-issuer.md
      - name: Reuse real SEC collector for AAPL if official contact is configured
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC official contact not configured; financial stage not tested"
            exit 0
          fi
          python scripts/unified_sec_one_issuer.py \
            --user-agent "$SEC_USER_AGENT" \
            --state-dir data/unified-aapl-sec \
            --out unified-aapl-sec-report.json
          python scripts/unified_single_issuer.py \
            --symbol AAPL \
            --financial-cik 0000320193 \
            --financial-report unified-aapl-sec-report.json \
            --out unified-single-issuer-with-financials.json \
            --markdown unified-single-issuer-with-financials.md
      - name: Reuse SEC documents for dated AAPL share and valuation source gates
        if: success()
        env:
          PYTHONPATH: .:src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ] || [ ! -f data/unified-aapl-sec/report.json ]; then
            echo "No verified SEC batch; valuation source review not attempted"
            exit 0
          fi
          python scripts/export_mvp_evidence.py \
            --state-dir data/unified-aapl-sec \
            --output data/unified-aapl-sec-export \
            --sources data/unified-aapl-sec-seed
          python scripts/unified_aapl_valuation.py \
            --user-agent "$SEC_USER_AGENT" \
            --state-dir data/unified-aapl-valuation \
            --source-bundle data/unified-aapl-sec-seed \
            --financial-batch data/unified-aapl-sec/batch.json \
            --metadata data/unified-aapl-sec/metadata.json \
            --companyfacts-dir data/unified-aapl-sec/companyfacts \
            --out unified-aapl-valuation-summary.json
          python scripts/unified_single_issuer.py \
            --symbol AAPL \
            --financial-cik 0000320193 \
            --financial-report unified-aapl-sec-report.json \
            --valuation-summary unified-aapl-valuation-summary.json \
            --out unified-aapl-with-valuation-gates.json \
            --markdown unified-aapl-with-valuation-gates.md
      - name: Archive timestamped proof without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-aapl-proof
          path: |
            unified-single-issuer.json
            unified-single-issuer.md
            unified-single-issuer-with-financials.json
            unified-single-issuer-with-financials.md
            unified-aapl-sec-report.json
            unified-aapl-valuation-summary.json
            unified-aapl-valuation-summary.score-plan.json
            unified-aapl-with-valuation-gates.json
            unified-aapl-with-valuation-gates.md
          if-no-files-found: ignore
          retention-days: 7
