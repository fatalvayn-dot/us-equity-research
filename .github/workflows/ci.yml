name: Foundation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tam test paketi
        if: matrix.python == '3.12'
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Python uyumluluk testleri
        if: matrix.python != '3.12'
        run: |
          mapfile -t modules < <(find tests -maxdepth 1 -name 'test_*.py' ! -name 'test_*_recorded.py' -printf '%f\n' | sort)
          python -m unittest -v "${modules[@]%.py}"
        env:
          PYTHONPATH: src:tests
      - run: python -m equity_research status
        env:
          PYTHONPATH: src
