name: Yeni 100 SEC sirketi kimlik ve sektor elemesi

on:
  push:
    branches: [main]
    paths: ['docs/operations/fresh100-discovery-request.json']

permissions:
  contents: read

concurrency:
  group: fresh100-independent-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tam farkli 100 sirket istegini onayla
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/operations/fresh100-discovery-request.json').read_text())
          if (x.get('purpose')!='select_100_distinct_nonfinancial_sec_candidates'
              or x.get('requested_on')!='2026-11-19'
              or x.get('old_cohort_size')!=100
              or x.get('target_cohort_size')!=100
              or x.get('max_sec_submissions')!=240
              or x.get('investment_orders') is not False):
              raise SystemExit('Yeni SEC arastirma listesinin istegi kapsam disi')
          PY
      - name: Resmi SEC ticari kimlik ve sektor raporuyla yeni 100 sirketi tara
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          python -m scripts.select_new_us_100 \
            --prior docs/evidence/common100/candidates.json \
            --output data/fresh100/candidates.json \
            --manifest data/fresh100/provenance.json
      - name: SEC kaynak kimligi ve ret sebeplerini sakla
        uses: actions/upload-artifact@v4
        with:
          name: fresh100-sec-scope-identity-evidence
          path: data/fresh100
          retention-days: 30
          if-no-files-found: error
