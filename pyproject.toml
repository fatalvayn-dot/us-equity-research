[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-research"
version = "0.25.0"
description = "Auditable research infrastructure for active US common equities"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
equity-research = "equity_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
